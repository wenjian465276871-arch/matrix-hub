name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.ACR_REGISTRY }}/matrix-hub/matrix-hub
  TAG: ${{ github.sha }}

jobs:
  test:
    name: 契约测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/electro-assist/api/requirements.txt pytest

      - name: 运行测试
        working-directory: apps/electro-assist/api
        run: python -m pytest tests -q

  build:
    name: 构建与校验
    needs: test
    runs-on: ubuntu-latest
    env:
      # secrets 未配置时跳过推送，避免 main 一直红；配好后自动生效
      ACR_READY: ${{ secrets.ACR_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（本地加载，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: matrix-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 Caddyfile
        run: |
          docker run --rm \
            -e SITE_DOMAIN=example.com -e ACME_EMAIL=admin@example.com \
            matrix-hub:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: 登录 ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ACR_READY == 'true'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: 推送镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ACR_READY == 'true'
        run: |
          docker tag matrix-hub:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "已推送 $IMAGE:$TAG"

  preflight:
    name: 服务器连通性自检
    # 只在 main 推送时跑：验证 SSH 密钥有效、docker/compose 可用。
    # 这是割接前的必要证据，失败即说明 secrets 内容有问题。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 准备 SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 连接并检查环境
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes -o ConnectTimeout=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'echo "host=$(hostname)"; docker --version; docker compose version; df -h / | tail -1'

  deploy:
    name: 部署到服务器
    needs: build
    # 割接（P0b）完成前保持关闭：nginx 仍占用 80/443，容器起不来。
    # 割接时在仓库 Settings → Variables 里把 DEPLOY_ENABLED 设为 true 即可启用。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 判断变更是否影响运行时
        id: scope
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 纯文档/CI 配置改动不重启生产
          if git diff --quiet "$base" "${{ github.sha }}" -- . \
               ':(exclude)docs/**' ':(exclude)*.md' ':(exclude).github/**' ':(exclude)*.txt'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "仅文档变更，跳过部署"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 SSH
        if: steps.scope.outputs.deploy == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 执行部署（健康检查失败自动回滚）
        if: steps.scope.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd /opt/matrix-hub && ./deploy.sh ${{ github.sha }}"

      - name: 部署后校验
        if: steps.scope.outputs.deploy == 'true'
        run: |
          curl -fsS --max-time 10 "https://${{ secrets.SITE_DOMAIN }}/healthz"

name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.ACR_REGISTRY }}/matrix-hub/matrix-hub
  TAG: ${{ github.sha }}

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（本地加载，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: matrix-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 Caddyfile
        run: |
          docker run --rm matrix-hub:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: 登录 ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: 推送镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag matrix-hub:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "已推送 $IMAGE:$TAG"

  deploy:
    name: 部署到服务器
    needs: build
    # 割接（P0b）完成前保持关闭：nginx 仍占用 80/443，容器起不来。
    # 割接时在仓库 Settings → Variables 里把 DEPLOY_ENABLED 设为 true 即可启用。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 准备 SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 执行部署（健康检查失败自动回滚）
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd /opt/matrix-hub && ./deploy.sh ${{ github.sha }}"

      - name: 部署后校验
        run: |
          curl -fsS --max-time 10 "https://${{ secrets.SITE_DOMAIN }}/healthz"

name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 2026-10-19：GitHub 出现一个无法取消的 in_progress run，永久占住旧 group。
  # 加 -2 切到新 group；平台回收旧 run 后可去掉后缀。
  group: ${{ github.workflow }}-${{ github.ref }}-2
  # 不能取消进行中的部署：deploy 经 SSH 在服务器上执行，runner 被 cancel 后
  # 服务器可能停在"镜像已换、健康检查没跑完"的中间态。排队等前一次结束更安全。
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.ACR_REGISTRY }}/matrix-hub/matrix-hub
  TAG: ${{ github.sha }}

jobs:
  test:
    name: 契约测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/electro-assist/api/requirements.txt \
                      -r apps/electro-assist/api/requirements-dev.txt

      - name: 静态检查（关键规则）
        working-directory: apps/electro-assist/api
        run: python -m ruff check .

      - name: 运行测试
        working-directory: apps/electro-assist/api
        run: python -m pytest tests -q

  e2e:
    name: E2E 冒烟
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/electro-assist/web/package-lock.json

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/electro-assist/api/requirements.txt \
                      -r apps/electro-assist/api/requirements-dev.txt

      - name: 安装前端依赖
        working-directory: apps/electro-assist/web
        run: npm ci

      - name: 安装浏览器
        working-directory: apps/electro-assist/web
        run: npx playwright install --with-deps chromium

      - name: 构建前端
        working-directory: apps/electro-assist/web
        run: npm run build

      - name: 起服务并跑冒烟
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e/uploads"
          (
            cd apps/electro-assist/api
            DB_PATH="$RUNNER_TEMP/e2e/e2e.db" \
            UPLOAD_DIR="$RUNNER_TEMP/e2e/uploads" \
            APP_ENV=dev \
            python -m uvicorn main:app --host 127.0.0.1 --port 8001 \
              > "$RUNNER_TEMP/api.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/api.pid"
          )
          (
            cd apps/electro-assist/web
            npm run preview -- --host 127.0.0.1 --port 4173 --strictPort \
              > "$RUNNER_TEMP/preview.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/preview.pid"
          )
          cleanup() {
            kill "$(cat "$RUNNER_TEMP/preview.pid" 2>/dev/null)" 2>/dev/null || true
            kill "$(cat "$RUNNER_TEMP/api.pid" 2>/dev/null)" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8001/healthz >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:4173/apps/electro-assist/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/healthz
          curl -fsS -o /dev/null http://127.0.0.1:4173/apps/electro-assist/

          cd apps/electro-assist/web
          npx playwright test

      - name: 失败时打印服务日志
        if: failure()
        run: |
          echo "===== api ====="; tail -80 "$RUNNER_TEMP/api.log" || true
          echo "===== preview ====="; tail -80 "$RUNNER_TEMP/preview.log" || true

      - name: 上传失败产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/electro-assist/web/test-results/
            apps/electro-assist/web/playwright-report/
          if-no-files-found: ignore

  build:
    name: 构建与校验
    needs: test
    runs-on: ubuntu-latest
    env:
      # secrets 未配置时跳过推送，避免 main 一直红；配好后自动生效
      ACR_READY: ${{ secrets.ACR_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（本地加载，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: matrix-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 Caddyfile
        run: |
          docker run --rm \
            -e SITE_DOMAIN=example.com -e ACME_EMAIL=admin@example.com \
            matrix-hub:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: 登录 ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ACR_READY == 'true'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: 推送镜像
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ACR_READY == 'true'
        run: |
          docker tag matrix-hub:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "已推送 $IMAGE:$TAG"

  preflight:
    name: 服务器连通性自检
    # 只在 main 推送时跑：验证 SSH 密钥有效、docker/compose 可用。
    # 这是割接前的必要证据，失败即说明 secrets 内容有问题。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 准备 SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 连接并检查环境
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes -o ConnectTimeout=10 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'echo "host=$(hostname)"; docker --version; docker compose version; df -h / | tail -1'

  deploy:
    name: 部署到服务器
    needs: [build, e2e]
    # 割接（P0b）完成前保持关闭：nginx 仍占用 80/443，容器起不来。
    # 割接时在仓库 Settings → Variables 里把 DEPLOY_ENABLED 设为 true 即可启用。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # 健康检查最长约 40s；超过 20 分钟说明 SSH/拉镜像卡住，必须失败而不是挂着。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 判断变更是否影响运行时
        id: scope
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 纯文档/CI/模板改动不重启生产
          if git diff --quiet "$base" "${{ github.sha }}" -- . \
               ':(exclude)docs/**' ':(exclude)*.md' ':(exclude).github/**' \
               ':(exclude)deploy/.env.example'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "仅文档变更，跳过部署"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 SSH
        if: steps.scope.outputs.deploy == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 2026-10-18 补：此前只跑服务器上的旧 deploy.sh，仓库改了也不生效，
      # 等于"部署脚本不在版本控制里"。部署前先同步这两个文件。
      - name: 同步部署产物（deploy.sh / backup.sh / compose.yml）
        if: steps.scope.outputs.deploy == 'true'
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            deploy/deploy.sh deploy/backup.sh docker/compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/matrix-hub/"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod 755 /opt/matrix-hub/deploy.sh /opt/matrix-hub/backup.sh"

      - name: 执行部署（健康检查失败自动回滚）
        if: steps.scope.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd /opt/matrix-hub && ./deploy.sh ${{ github.sha }}"

      - name: 部署后校验
        if: steps.scope.outputs.deploy == 'true'
        run: |
          curl -fsS --max-time 10 "https://${{ secrets.SITE_DOMAIN }}/healthz"

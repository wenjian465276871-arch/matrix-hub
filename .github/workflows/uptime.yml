name: uptime

# 外部探活：从 GitHub 的网络上探，不经过服务器自己。
# 目的不是 SLA 监控，而是"演示当天站点挂了，能在 10 分钟内收到失败邮件"。
# GitHub 的 schedule 有延迟（高峰可到数分钟），这里只当低成本兜底。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 探活 /healthz 与首页
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查健康与页面
        run: |
          set -euo pipefail
          health=$(curl -fsS --max-time 10 "https://www.superplayer007.cn/healthz?scope=ready")
          echo "healthz: $health"
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"db":"ok"'
          echo "$health" | grep -q '"disk":"ok"'

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
            https://www.superplayer007.cn/apps/electro-assist/)
          echo "app: $code"
          test "$code" = "200"

          # 业务接口至少能返回已发布列表（不依赖模型）
          count=$(curl -fsS --max-time 10 https://www.superplayer007.cn/api/electro/guides \
            | grep -o '"count":[0-9]*' | head -1 | cut -d: -f2)
          echo "guides: $count"
          test "${count:-0}" -ge 1

      # 额度告警：预算水位是业务指标，不该让站点"不健康"（所以不进 healthz.status），
      # 但必须有人知道。借 GitHub Actions 的失败通知当告警通道——零新增基础设施。
      - name: 预算水位（warn/critical 则失败并通知）
        run: |
          set -euo pipefail
          health=$(curl -fsS --max-time 10 https://www.superplayer007.cn/healthz)
          read -r level ratio <<<"$(printf '%s' "$health" | python3 -c '
          import json, sys
          b = json.load(sys.stdin).get("budget", {})
          print(b.get("level", "unknown"), b.get("ratio", "?"))
          ')"
          echo "budget level=$level ratio=$ratio"
          case "$level" in
            warn|critical)
              echo "::error::LLM 日预算水位 $level（已用比例 $ratio）"
              exit 1
              ;;
            unknown)
              echo "::warning::healthz 未返回 budget 字段（后端版本可能过旧）"
              ;;
          esac

      # 回滚失败告警（2026-11-08 加，对应服务器专档 #30）。
      # 看门狗回滚失败时会把 failed=true 写进 rollback_state.json，healthz 的
      # rollback 字段透出来。这里借 GitHub 的失败通知当告警通道——仍然是零新增基础设施。
      # 局限照实说：cron 写每 10 分钟，但 GitHub 实际日均只跑 2–8 次；它是兜底，不是秒级告警。
      - name: 自动回滚是否失败过（failed=true 则失败并通知）
        run: |
          set -euo pipefail
          health=$(curl -fsS --max-time 10 https://www.superplayer007.cn/healthz)
          state=$(printf '%s' "$health" | python3 -c '
          import json, sys
          print(json.dumps(json.load(sys.stdin).get("rollback", {}), ensure_ascii=False))
          ')
          echo "rollback: $state"
          if printf '%s' "$state" | grep -q '"failed": *true'; then
            echo "::error::上一次自动回滚失败，站点可能处于未恢复状态：$state"
            exit 1
          fi
          # 字段缺失多半是后端版本过旧（还没带这个能力），提示而非失败
          if ! printf '%s' "$state" | grep -q 'failed'; then
            echo "::warning::healthz 未返回 rollback 字段（后端版本可能过旧）"
          fi

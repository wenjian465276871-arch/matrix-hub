# 依赖更新：每周一 03:00（东八区）开一批 PR。
# 目的不是"永远最新"，而是让"我们落后了多久"变成可见事实——
# 没有它，锁文件会把项目锁死在某个再也升不上去的版本上。
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/electro-assist/api
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(pip)"
    labels:
      - dependencies
      - backend
    groups:
      backend-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: npm
    directory: /apps/electro-assist/web
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(npm)"
    labels:
      - dependencies
      - frontend
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # 2026-10-29：vite 8 与 vue-router 5 单独开 PR 都是红的——
    # vite 8 要求 @vitejs/plugin-vue ≥6，vue-router 5 又要求 vite ≥7，
    # 三者互相咬住。分开提只会留下永远合不进去的红 PR，所以忽略 major，
    # 改由人工开「vite + plugin-vue + vue-router」联动分支升级（见 DEVELOPMENT §4.1）。
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-vue"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(actions)"
    labels:
      - dependencies
      - ci
    # Action 版本被钉在 commit sha 上，Dependabot 会把新 sha 连同版本注释一起改。
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker
    # node 只在 LTS 线上走：25 是奇数版（非 LTS），升上去等于拿生产做实验。
    # caddy 不忽略——它是网关，升版要过反代/CSP/证书，但"落后多久"必须可见，
    # PR 会一直挂着，等运维窗口验证后再合。
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

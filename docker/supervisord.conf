[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info
user=app
; 新建文件一律 600：数据库、WAL、上传素材、保留期状态都是访客数据，
; 计划 §11.3.3 要求 SQLite 600，靠 chmod 补一次治不了根——每次新建都会回到 644。
; 子进程（uvicorn / caddy）继承本 umask。静态产物在镜像里构建，不受影响。
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:electro]
; --no-access-log：访问日志只留 Caddy 一份（计划 §9.4 #3）。不关的话每条请求
; 会同时写进 docker logs，而 /healthz 每 30 秒一次——实测最后 40 行里 38 行是探针，
; 真请求反而被淹没。OPERATIONS §5.0 此前已写"stdout 只保留启动日志"，这次才是真的。
command=uvicorn main:app --host 127.0.0.1 --port 8001 --workers 1 --proxy-headers --forwarded-allow-ips=127.0.0.1 --no-access-log
directory=/opt/electro
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

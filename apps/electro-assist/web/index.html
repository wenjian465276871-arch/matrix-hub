<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电气调试 AI 作业助手</title>
<style>
  :root { --primary:#0b6e78; --ink:#12181c; --ink2:#3d4a52; --line:#dfe5e8; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#f6f8f9; color:var(--ink); padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  main { max-width:560px; }
  .tag {
    display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--primary); border:1px solid #b9dade; background:#eaf5f6;
    border-radius:999px; padding:3px 10px; margin-bottom:18px;
  }
  h1 { font-size:26px; margin:0 0 12px; line-height:1.4; }
  p { margin:0 0 12px; color:var(--ink2); }
  ul { margin:0; padding-left:20px; color:var(--ink2); }
  li { margin-bottom:6px; }
  a { color:var(--primary); }
  footer { margin-top:28px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:#6b7a83; }
</style>
</head>
<body>
<main>
  <span class="tag">开发中 · P0</span>
  <h1>电气调试 AI 作业助手</h1>
  <p>这个模块正在建设。基础设施已经就绪，业务功能按阶段逐步上线。</p>
  <p>规划中的能力：</p>
  <ul>
    <li>工艺文本 → 结构化作业数据（含视觉描述）</li>
    <li>可视化作业指导书生成与打印</li>
    <li>按步骤引导作业、判据校验、记录导出</li>
    <li>异常现象 → 故障排查（向量检索 + 生成）</li>
  </ul>
  <footer>
    所有内容为演示数据，非实际作业依据。 ·
    <a href="/">返回门户</a>
  </footer>
</main>
</body>
</html>
